<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Right Shoulder Routine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6f78'/%3E%3Ccircle cx='32' cy='18' r='7' fill='%23fff'/%3E%3Cpath d='M32 25v16M32 31l-12 8M32 31l12-8' stroke='%23fff' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231f6f78'/%3E%3Ccircle cx='32' cy='18' r='7' fill='%23fff'/%3E%3Cpath d='M32 25v16M32 31l-12 8M32 31l12-8' stroke='%23fff' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shoulder">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one-screen stepper. Sticky progress header, one stretch card at a time, fixed controls at the bottom. */
:root{
  --bg:#f6f4ee; --card:#ffffff; --fg:#1f2a2e; --muted:#5f6c72; --line:#dcd8cc;
  --accent:#1f6f78; --accent-fg:#ffffff; --soft:#e3efef; --warn:#b6541c; --warn-soft:#fbeadf; --ok:#2e7d4f;
  --display:"Sora",system-ui,sans-serif; --body:"Nunito Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141a1c; --card:#1d2528; --fg:#e8ebe9; --muted:#9aa6a8; --line:#2f3a3e;
  --accent:#5fb7c1; --accent-fg:#0d1416; --soft:#1f3236; --warn:#f0a06c; --warn-soft:#3a2418; --ok:#7fcf9c; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141a1c; --card:#1d2528; --fg:#e8ebe9; --muted:#9aa6a8; --line:#2f3a3e;
  --accent:#5fb7c1; --accent-fg:#0d1416; --soft:#1f3236; --warn:#f0a06c; --warn-soft:#3a2418; --ok:#7fcf9c; color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;
  -webkit-text-size-adjust:100%;display:flex;flex-direction:column}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hrow h1{font-size:18px}
.progress{display:flex;gap:4px;max-width:640px;margin:8px auto 0}
.progress span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress span.done{background:var(--ok)}
.progress span.now{background:var(--accent)}
.linkbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--fg);font-size:14px;font-weight:600}

main{flex:1;overflow-y:auto;padding-block:16px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.stepnum{display:inline-block;background:var(--soft);color:var(--accent);font-family:var(--display);font-weight:700;font-size:13px;
  padding:3px 10px;border-radius:999px;margin-bottom:8px}
.card h2{font-size:24px}
.dose{color:var(--muted);font-weight:600;margin-top:4px}
.guide{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;margin:14px 0 0}
.guide dt{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding-top:3px;white-space:nowrap}
.guide dt.no{color:var(--warn)}
.guide dd{margin:0;min-width:0}
.video{margin-top:14px;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%}
.video iframe{width:100%;height:100%;border:0;display:block}
.vlabel{font-size:13px;color:var(--muted);margin-top:6px}
.demo{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.demo a{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);text-decoration:none;
  padding:9px 14px;border-radius:999px;font-weight:700;font-size:15px}
.demo a svg{width:16px;height:16px}

.timer{display:flex;align-items:center;gap:14px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);flex-wrap:wrap}
.clock{font-family:var(--display);font-weight:700;font-size:38px;font-variant-numeric:tabular-nums;min-width:96px}
.timer button{border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:16px}
.tstart{background:var(--accent);color:var(--accent-fg)}
.treset{background:transparent;border:1px solid var(--line) !important;color:var(--fg)}
.tlabel{flex-basis:100%;color:var(--muted);font-size:14px}

.rules{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:14px;padding:16px}
.rules h3{font-size:16px;color:var(--warn);margin-bottom:6px}
.rules ul{margin:0;padding-left:20px}

.overview .item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.overview .item:last-child{border-bottom:none}
.overview .n{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:13px;flex-shrink:0}
.overview .n.done{background:var(--ok);color:#fff}
.overview .t{flex:1;min-width:0}
.overview .t small{display:block;color:var(--muted)}
.overview button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--fg);font-weight:600;font-size:14px}

.install{font-size:15px;color:var(--muted)}
.install ol{padding-left:20px;margin:6px 0 0}

footer{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.frow{display:flex;gap:10px;max-width:640px;margin:0 auto}
.frow button{flex:1;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:17px}
.prev{background:transparent;border:1px solid var(--line) !important;color:var(--fg);flex:0 0 auto;padding-inline:18px !important}
.next{background:var(--accent);color:var(--accent-fg)}
.done-card{text-align:center}
.done-card .big{font-size:56px;line-height:1}
.streak{color:var(--muted)}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){ .card{animation:in .25s ease} @keyframes in{from{opacity:.4;transform:translateY(6px)}} }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div><div class="eyebrow">Right shoulder · until PT starts</div><h1 id="htitle">Stretch routine</h1></div>
    <button class="linkbtn" id="toggleView" type="button">All steps</button>
  </div>
  <div class="progress" id="progress"></div>
</header>

<main><div class="wrap" id="content"></div></main>

<footer><div class="frow">
  <button class="prev" id="prevBtn" type="button">Back</button>
  <button class="next" id="nextBtn" type="button">Start</button>
</div></footer>


<script>
const yt = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
const STEPS = [
 {video:'QF_ubbr_RUE', name:'Pendulum swings', dose:'30–60 sec each: circles both ways, then front-to-back, then side-to-side', timer:60, tlabel:'One direction',
  setup:"Stand beside a table or counter. Put your LEFT hand on it and lean forward so your torso is roughly 45°. Let the right arm hang straight down, completely relaxed.",
  move:"Shift your weight between your feet so the hanging arm swings on its own. Circles clockwise, then counter-clockwise, then front-to-back, then side-to-side. 30–60 seconds each.",
  feel:"A light pull or 'opening' in the shoulder. The arm should feel heavy.",
  avoid:"Using the shoulder muscles to make the circles. Swinging big and fast. Any pinch at the top of the shoulder.",
  demo:[['Codman Pendulum Circles · Ask Doctor Jo', yt('Codman Pendulum Circles Ask Doctor Jo')],['Pendulum front to back', yt('Codman Pendulum Front to Back Ask Doctor Jo')]]},
 {video:'ekJzJTnd43s', name:'Chin tucks', dose:'10 reps · hold 3 sec', timer:3, tlabel:'One hold', reps:10,
  setup:"Sit tall on a firm chair, feet flat, shoulders relaxed, eyes looking straight ahead.",
  move:"Glide the head straight back on the neck (make a double chin) without tipping the chin up or down. Hold 3 seconds, release. 10 reps.",
  feel:"A gentle stretch at the base of the skull and work in the front of the neck.",
  avoid:"Nodding the chin to the chest. Jamming the head back hard. Rocking the upper body.",
  demo:[['How to do a chin tuck · PT Progress', yt('chin tuck exercise correctly physical therapist')]]},
 {video:'QN1oZVMMRjE', name:'Shoulder-blade squeezes', dose:'10–15 reps · hold 5 sec', timer:5, tlabel:'One hold', reps:12,
  setup:"Sit or stand tall, arms relaxed at your sides, palms facing forward.",
  move:"Draw both shoulder blades back and DOWN, as if tucking them into your back pockets. Hold 5 seconds, relax fully. 10–15 reps.",
  feel:"Muscles working between the shoulder blades and a slight opening across the chest.",
  avoid:"Shrugging toward the ears. Arching the low back. Holding your breath.",
  demo:[['Scapular squeeze · Hinge Health', 'https://www.hingehealth.com/resources/articles/scapular-squeezes'],['Bob & Brad impingement moves', yt('Bob and Brad shoulder impingement shoulder squeezes')]]},
 {video:'kCoTeRB8c-g', name:'Thoracic extension over chair', dose:'10 slow reps', timer:0, reps:10,
  setup:"Sit in a chair whose back ends around mid-shoulder-blade height. Interlace fingers behind your head, elbows pointing forward (this keeps the right shoulder safe).",
  move:"Lean back so your upper back arches over the top edge of the chair. Exhale as you go, pause 2 seconds, return. 10 slow reps. Scoot up or down a little to hit different levels.",
  feel:"A stretch across the upper back and front of the chest.",
  avoid:"Arching from the low back. Letting the head drop back. Pushing into any shoulder pain.",
  demo:[['Seated thoracic extension demo', yt('seated thoracic extension chair physical therapy')]]},
 {video:'TCDA6qCp1FU', name:'Cross-body stretch', dose:'3 × 30 sec', timer:30, tlabel:'One hold', reps:3,
  setup:"Stand or sit tall. Set your shoulder blades back and down first and keep them there.",
  move:"Bring the right arm across your chest at chest height or lower. Hook the left hand just above the right elbow and pull gently toward the chest. Hold 30 seconds, 3 times.",
  feel:"A stretch in the BACK of the right shoulder.",
  avoid:"Letting the right shoulder hike up or roll forward. Twisting the trunk. Pulling the arm above shoulder height. Any pinch in the front of the shoulder.",
  demo:[['Cross body stretch · Prehab Guys', 'https://library.theprehabguys.com/vimeo-video/standing-shoulder-cross-body-stretch-posterior-cuff-2/'],['YouTube demo', yt('cross body shoulder stretch posterior capsule physical therapy')]]},
 {video:'069o76BafTk', name:'Low doorway chest stretch', dose:'3 × 30 sec', timer:30, tlabel:'One hold', reps:3,
  setup:"Stand in a doorway. Place the right forearm on the frame with the elbow BELOW shoulder height (hand about chest height). Right foot slightly forward.",
  move:"Shift your weight onto the front foot and turn your chest slightly away from the frame until you feel the stretch. Hold 30 seconds, 3 times.",
  feel:"A stretch under the collarbone and in the front of the shoulder.",
  avoid:"Raising the elbow to or above the shoulder. Leaning so far the shoulder rolls forward. Any tingling in the hand (ease off).",
  demo:[['Pec minor doorway stretch · Prehab Guys', 'https://library.theprehabguys.com/vimeo-video/pec-minor-stretch-doorway/'],['YouTube demo', yt('pec minor doorway stretch elbow below shoulder')]]},
 {video:'pgsPQ1_5e0w', name:'Table slides', dose:'10 reps · pause 3 sec at the end', timer:3, tlabel:'End pause', reps:10,
  setup:"Sit facing a table or sideways to it. Rest the right forearm on a towel, elbow bent, thumb pointing up. Chair height so the shoulder sits level and relaxed.",
  move:"Lean your trunk forward from the hips so the towel slides away from you; the arm just rides along. Pause 3 seconds at the end, then sit back up. 10 reps.",
  feel:"A gentle stretch at the end of the reach, mostly in the front and top of the shoulder. Mild discomfort is okay; sharp pain is not.",
  avoid:"Lifting the arm off the table. Pushing through pain. Shrugging the shoulder.",
  demo:[['Shoulder Flexion Table Slides · Ask Doctor Jo', yt('Shoulder Flexion Table Slides Ask Doctor Jo')]]},
];

const KEY='shoulder-routine-v1';
let state={step:-1, done:[], log:[]};
try{const s=JSON.parse(localStorage.getItem(KEY)); if(s) state=Object.assign(state,s, {step:-1});}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

let view='step';
const content=document.getElementById('content'), prevBtn=document.getElementById('prevBtn'), nextBtn=document.getElementById('nextBtn');
const toggle=document.getElementById('toggleView');
let timer=null, remaining=0;

function stopTimer(){ if(timer){clearInterval(timer);timer=null;} }
function fmt(s){return s>=60? Math.floor(s/60)+':'+String(s%60).padStart(2,'0') : String(s);}
function beep(){ try{const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.connect(g); g.connect(ac.destination); o.frequency.value=880; g.gain.value=.15; o.start(); o.stop(ac.currentTime+.25);}catch(e){} }

function renderProgress(){
  const p=document.getElementById('progress'); p.innerHTML='';
  STEPS.forEach((_,i)=>{const s=document.createElement('span'); if(state.done.includes(i)) s.className='done'; if(i===state.step) s.className='now'; p.appendChild(s);});
}

function intro(){
  const today=state.log.filter(d=>d===new Date().toDateString()).length;
  return `<div class="card">
    <div class="eyebrow">About 10 minutes · 1–2× a day</div>
    <h2 style="margin-top:6px">Seven stretches, in order</h2>
    <p>For right-shoulder impingement with biceps and calcific tendonitis. Warm up first: a warm shower or 5 minutes of walking.</p>
    <p class="streak">Completed today: <strong>${today}</strong> · total sessions logged: <strong>${state.log.length}</strong></p>
  </div>
  <div class="rules"><h3>Ground rules</h3><ul>
    <li>Pain stays at 3/10 or lower, and no worse an hour later.</li>
    <li>Arm stays below shoulder height. Overhead is what pinches.</li>
    <li>Skip: behind-the-back stretches, straight-arm-behind-you biceps stretches, sleeper stretch, weights, sleeping on the right side.</li>
    <li>Sudden severe pain (often at night) can be a calcific flare. Drop to pendulums only and call Dr. Lanzi's office: <strong>713-441-9000</strong>.</li>
  </ul></div>
  <div class="card install"><strong style="color:var(--fg)">Save as an app on iPhone</strong>
    <ol><li>Open this page in Safari.</li><li>Tap the Share button (square with arrow).</li><li>Tap <em>Add to Home Screen</em>, then <em>Add</em>.</li></ol>
  </div>`;
}

function stepCard(i){
  const s=STEPS[i];
  const demos=s.demo.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>${t}</a>`).join('');
  const timerHtml = s.timer? `<div class="timer"><div class="clock" id="clock">${fmt(s.timer)}</div>
      <button class="tstart" id="tstart" type="button">Start</button><button class="treset" id="treset" type="button">Reset</button>
      <div class="tlabel">${s.tlabel}${s.reps?` · ${s.reps} reps`:''}. Tap Start for each hold.</div></div>` : '';
  return `<div class="card">
    <span class="stepnum">Step ${i+1} of ${STEPS.length}</span>
    <h2>${s.name}</h2>
    <div class="dose">${s.dose}</div>
    <div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${s.video}?rel=0&modestbranding=1&playsinline=1" title="${s.name} demo" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>
    <div class="vlabel">Watch once, then follow the steps below</div>
    <dl class="guide">
      <dt>Set up</dt><dd>${s.setup}</dd>
      <dt>Movement</dt><dd>${s.move}</dd>
      <dt>Feel</dt><dd>${s.feel}</dd>
      <dt class="no">Don't</dt><dd>${s.avoid}</dd>
    </dl>
    <div class="demo">${demos}</div>
    ${timerHtml}
  </div>`;
}

function doneCard(){
  return `<div class="card done-card"><div class="big">✓</div><h2>Routine complete</h2>
    <p>Logged for today. Ice for 10–15 minutes if the shoulder feels warm afterward.</p>
    <p class="streak">Sessions logged: <strong>${state.log.length}</strong></p></div>`;
}

function overview(){
  return `<div class="card overview"><h2 style="font-size:20px;margin-bottom:6px">All steps</h2>` +
    STEPS.map((s,i)=>`<div class="item"><div class="n ${state.done.includes(i)?'done':''}">${i+1}</div>
      <div class="t"><strong>${s.name}</strong><small>${s.dose}</small></div>
      <button type="button" data-go="${i}">Open</button></div>`).join('') + `</div>`;
}

function render(){
  stopTimer();
  renderProgress();
  if(view==='list'){ content.innerHTML=overview(); toggle.textContent='Back to routine'; prevBtn.hidden=true; nextBtn.textContent='Close list';
    content.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.step=+b.dataset.go; view='step'; render();}); return; }
  toggle.textContent='All steps'; prevBtn.hidden=false;
  if(state.step<0){ content.innerHTML=intro(); prevBtn.hidden=true; nextBtn.textContent=state.done.length? 'Continue':'Start'; }
  else if(state.step>=STEPS.length){ content.innerHTML=doneCard(); nextBtn.textContent='Start over'; }
  else {
    content.innerHTML=stepCard(state.step);
    nextBtn.textContent= state.step===STEPS.length-1 ? 'Finish' : 'Done, next';
    const s=STEPS[state.step];
    if(s.timer){
      const clock=document.getElementById('clock'), st=document.getElementById('tstart'), rs=document.getElementById('treset');
      remaining=s.timer;
      st.onclick=()=>{
        if(timer){stopTimer(); st.textContent='Resume'; return;}
        if(remaining<=0) remaining=s.timer;
        st.textContent='Pause';
        timer=setInterval(()=>{remaining--; clock.textContent=fmt(remaining); if(remaining<=0){stopTimer(); beep(); st.textContent='Start'; remaining=s.timer; clock.textContent=fmt(s.timer);} },1000);
      };
      rs.onclick=()=>{stopTimer(); remaining=s.timer; clock.textContent=fmt(s.timer); st.textContent='Start';};
    }
  }
  document.querySelector('main').scrollTop=0;
}

nextBtn.onclick=()=>{
  if(view==='list'){view='step'; render(); return;}
  if(state.step<0){ state.step=0; }
  else if(state.step>=STEPS.length){ state.step=-1; state.done=[]; }
  else { if(!state.done.includes(state.step)) state.done.push(state.step); state.step++;
         if(state.step>=STEPS.length){ state.log.push(new Date().toDateString()); state.done=[]; } }
  save(); render();
};
prevBtn.onclick=()=>{ if(state.step>=0){ state.step--; render(); } };
toggle.onclick=()=>{ view = view==='list'?'step':'list'; render(); };
render();
</script>
</body>
</html>
