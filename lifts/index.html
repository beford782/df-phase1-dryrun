<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lifts">
<meta name="theme-color" content="#eef1f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)">
<title>Shoulder-Safe Lifts</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone column — sticky session strip, the session as a stack of exercise rows (finished ones collapse), fixed bottom tab bar. Kinesio-tape blue on cool chalk. */
:root{
  --bg:#eef1f0; --surface:#ffffff; --sunk:#e2e7e5; --ink:#17201d; --muted:#5c6b66; --line:#d3dad7;
  --tape:#1d64b8; --tape-ink:#ffffff; --tape-soft:#dbe8f7;
  --go:#2f7d4f; --go-soft:#dff0e5; --warn:#a96a08; --warn-soft:#f8ecd2; --stop:#b3362f; --stop-soft:#f7e0de;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18201d; --sunk:#111816; --ink:#e7eeeb; --muted:#93a39d; --line:#2a3531;
  --tape:#5aa0ec; --tape-ink:#06121f; --tape-soft:#16283d;
  --go:#5cc184; --go-soft:#14291d; --warn:#e2a64a; --warn-soft:#2c2212; --stop:#ee7a71; --stop-soft:#2f1715; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18201d; --sunk:#111816; --ink:#e7eeeb; --muted:#93a39d; --line:#2a3531;
  --tape:#5aa0ec; --tape-ink:#06121f; --tape-soft:#16283d;
  --go:#5cc184; --go-soft:#14291d; --warn:#e2a64a; --warn-soft:#2c2212; --stop:#ee7a71; --stop-soft:#2f1715; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button,input,textarea,select,a,label{touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
a{color:var(--tape)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:10px}
.brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--tape)}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
.ses{border:0;background:var(--sunk);border-radius:10px;padding:7px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;position:relative}
.ses .c{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.ses .n{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;line-height:1.1;text-align:center}
.ses[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink)}
.ses[aria-pressed="true"] .n{color:var(--tape-ink);opacity:.85}
.ses .flag{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 4px}
.ses .tick{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--go)}
.ses[aria-pressed="true"] .tick{background:var(--tape-ink)}

/* session header */
.sess{padding-block:12px 4px;display:grid;gap:8px}
.daterow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.datebtn{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.past{font-size:12.5px;font-weight:600;color:var(--warn)}
.sess h1{font-size:40px;font-weight:800;line-height:.95;text-transform:uppercase}
.sess h1 .code{color:var(--tape)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chip.load-None,.chip.load-Light{color:var(--go)} .chip.load-Moderate{color:var(--warn)}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--tape);transition:width .25s}
.note{font-size:13.5px;color:var(--muted);max-width:65ch;margin:0}

/* blocks */
section.block{margin-top:18px}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.bhead h2{font-size:22px;font-weight:700;text-transform:uppercase}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{border-top:1px solid var(--line);scroll-margin-top:150px}
.row:first-child{border-top:0}
.rbody{padding:12px 14px;display:grid;gap:10px}
.row.next{box-shadow:inset 4px 0 0 var(--tape)}
.row.complete{background:color-mix(in srgb,var(--go-soft) 55%,var(--surface))}
.rtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:none;border:0;padding:0;text-align:left;width:100%;cursor:default}
.rtop.tog{cursor:pointer}
.rname{font-weight:700;font-size:15.5px;line-height:1.25;min-width:0;display:flex;gap:7px;align-items:flex-start}
.rname .ok{flex:none;width:18px;height:18px;border-radius:50%;background:var(--go);display:grid;place-items:center;margin-top:1px}
.rname .ok svg{width:11px;height:11px;stroke:var(--surface)}
.upnext{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tape);display:block;margin-bottom:2px}
.rx{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;padding-top:2px}
.cue{font-size:14px;color:var(--muted);margin:0}
.sets{display:flex;gap:7px;flex-wrap:wrap}
.set{width:48px;height:48px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-family:var(--mono);font-size:15px;font-weight:600;color:var(--muted);display:grid;place-items:center}
.set[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:var(--surface)}
.wrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.step{width:48px;height:48px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:600;cursor:pointer;line-height:1}
.wt{width:76px;height:48px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:18px;text-align:center;padding:0 4px}
.u{font-size:12px;color:var(--muted)}
.uselast{border:0;background:var(--tape-soft);color:var(--tape);font-weight:700;font-size:13px;border-radius:999px;padding:0 12px;height:36px;cursor:pointer;margin-left:auto}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.last{font-size:12.5px;color:var(--muted)}
.last b{font-family:var(--mono);color:var(--ink);font-weight:600}
.btns{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;border:0;border-radius:999px;padding:0 12px;height:36px;cursor:pointer;white-space:nowrap}
.demo{color:var(--tape);background:var(--tape-soft)}
.demo[aria-expanded="true"]{background:var(--tape);color:var(--tape-ink)}
.demo svg{width:12px;height:12px}
.felt{color:var(--muted);background:var(--sunk)}
.felt[aria-pressed="true"]{background:var(--stop);color:var(--surface)}
.where{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wh{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;height:36px;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer}
.wh[aria-pressed="true"]{background:var(--stop-soft);border-color:var(--stop);color:var(--stop)}
.vslot{display:grid;gap:6px;padding:0 14px 12px}
.vslot:empty{display:none}
.video{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;background:var(--sunk)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vcap{font-size:11.5px;color:var(--muted);margin:0}
.ctl{display:grid;gap:10px}
.row.collapsed .cue,.row.collapsed .ctl{display:none}

/* shoulder check */
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:16px}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.pt{height:46px;border:0;border-radius:9px;background:var(--sunk);font-family:var(--mono);font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.pt.z1[aria-pressed="true"]{background:var(--go);color:var(--surface)}
.pt.z2[aria-pressed="true"]{background:var(--stop);color:var(--surface)}
.scalekey{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px}
.toggle{display:flex;gap:8px}
.tg{flex:1;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.verdict{border-radius:10px;padding:11px 12px;font-size:14px;font-weight:500}
.verdict.ok{background:var(--go-soft);color:var(--go)}
.verdict.back{background:var(--warn-soft);color:var(--warn)}
.verdict.stop{background:var(--stop-soft);color:var(--stop)}
.verdict strong{display:block;font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.q{display:block;margin-bottom:7px}
textarea{width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:8px 10px;resize:vertical}

/* plan + log */
.prose{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.prose ul{margin:0;padding-left:18px;display:grid;gap:7px}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wk{height:56px;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.wk b{font-family:var(--display);font-size:22px;line-height:1}
.wk span{font-size:10.5px;color:var(--muted);font-weight:600}
.wk[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wk[aria-pressed="true"] span{color:var(--bg);opacity:.8}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:0}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty h3{font-size:20px;color:var(--ink);text-transform:uppercase;margin-bottom:4px}
.pp{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:1px 6px;font-family:var(--mono);font-size:12.5px;font-weight:600}
.pp.ok{background:var(--go-soft);color:var(--go)} .pp.hi{background:var(--stop-soft);color:var(--stop)} .pp.na{background:var(--sunk);color:var(--muted)}
details.ent{border-top:1px solid var(--line)}
details.ent:first-child{border-top:0}
details.ent summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
details.ent summary::-webkit-details-marker{display:none}
.sd{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.st{font-weight:700}
.sr{grid-row:1/3;grid-column:2;display:flex;gap:5px;align-items:center}
.ebody{padding:0 14px 14px;display:grid;gap:10px}
.ebody table{font-size:13px}
.ebody td,.ebody th{padding:7px 6px}
.fl{color:var(--stop);font-weight:600}
.backup{display:grid;gap:10px}
.bbtns{display:flex;gap:8px;flex-wrap:wrap}
.bb{height:46px;padding:0 18px;border-radius:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:var(--surface)}
.bb.primary{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.bstat{font-size:13px;color:var(--muted)}
.bstat.stale{color:var(--warn);font-weight:600}
select{height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 10px;width:100%}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--tape);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--tape-soft);stroke:none}
.chart .dt{fill:var(--surface);stroke:var(--tape);stroke-width:2}
.chart .end{fill:var(--tape);stroke:none}
.chart .endlbl{fill:var(--ink);font-weight:600;font-size:11px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.sync{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:560px}
.tab{border:0;background:transparent;border-radius:10px;padding:10px 0;font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--tape-soft);color:var(--tape)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Shoulder-safe <b>lifts</b></div>
    <div class="strip" role="group" aria-label="Pick a session" id="strip"></div>
  </header>
  <main id="view-today" role="tabpanel" aria-labelledby="tab-today">
    <div id="sesshead"></div>
    <div id="workout"></div>
    <div id="check"></div>
  </main>
  <main id="view-plan" role="tabpanel" aria-labelledby="tab-plan" hidden></main>
  <main id="view-log" role="tabpanel" aria-labelledby="tab-log" hidden></main>
  <p class="sync" id="sync">Your log is saved on this phone.</p>
</div>
<input type="file" id="importfile" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" hidden></div>
<nav class="tabs" role="tablist" aria-label="Sections"><div class="in">
  <button class="tab" role="tab" id="tab-today" aria-controls="view-today" aria-selected="true">Session</button>
  <button class="tab" role="tab" id="tab-plan" aria-controls="view-plan" aria-selected="false" tabindex="-1">Plan</button>
  <button class="tab" role="tab" id="tab-log" aria-controls="view-log" aria-selected="false" tabindex="-1">Log</button>
</div></nav>

<script>
(function(){
'use strict';
/* ================= program ================= */
// sets: a number, or [week1, week2, week3, week4]; 0 = not this week.
// step: weight +/- increment in lb; w:false = bodyweight / no weight field.
const X=(k,n,sets,reps,cue,o={})=>Object.assign({k,n,sets,reps,cue,w:true,step:5},o);
const SESSIONS=[
 {code:'A',short:'Back',name:'Back + biceps',time:'55 min',load:'Moderate',ex:[
  X('csrow','Chest-supported DB row, neutral grip',[3,3,4,4],'10','Elbows drive toward the hips, not up toward the ears.'),
  X('cablerow','Seated cable row, neutral handle',[2,3,3,3],'10','Pull to the lower ribs; shoulder blades back and down first.'),
  X('dbrow','Single-arm DB row',[2,2,3,3],'10 / side','Brace on the bench; no shrug at the top.'),
  X('sapd','Straight-arm band pulldown',[2,2,3,3],'12','From shoulder height to hips. Blade drops into the back pocket.'),
  X('pronet','Prone T raise, thumbs up',3,'12','No weight to start, then 2–5 lb on a flat bench. Mid-trap, not upper.',{step:1}),
  X('sler','Side-lying DB external rotation',2,'12–15','Towel under the elbow, elbow pinned to your side. Light. Rotate only as far as is comfortable.',{step:1}),
  X('pup','Push-up plus, hands on a bench',[2,3,3,3],'10','At the top, push the floor away to spread the shoulder blades.',{w:false}),
  X('hammer','DB hammer curl',2,'10','Elbows pinned at the sides.'),
  X('cablecurl','Cable curl, light',[0,0,2,2],'12','Weeks 3–4 only. Stop if you feel it in the front of the shoulder.')]},
 {code:'B',short:'Legs',name:'Legs (squat) + core',time:'50 min',load:'None',ex:[
  X('goblet','Goblet squat (or safety-bar / belt squat)',4,'8','No straight bar on your back.'),
  X('bss','Bulgarian split squat, DB at chest',3,'8 / side','Torso tall.'),
  X('legext','Leg extension',3,'12','2-second lower.'),
  X('calf','Seated calf raise',3,'15','Pause at the bottom.'),
  X('pallof','Pallof press, cable at chest height',3,'10 / side','Shoulders stay down.'),
  X('deadbug','Dead bug',3,'8 / side','Low back flat on the floor.',{w:false})]},
 {code:'C',short:'Arms+hinge',name:'Arms + legs (hinge)',time:'60 min',load:'Light',note:'Arms first while you’re fresh, then legs.',ex:[
  X('rope','Rope triceps pushdown',3,'12','Elbows at the sides; spread the rope at the bottom.'),
  X('kick','DB triceps kickback',3,'12','Upper arm parallel to the floor; only the forearm moves.',{step:2.5}),
  X('hammer','DB hammer curl',2,'10','No swinging.'),
  X('revcurl','EZ-bar reverse curl',2,'15','Forearms and brachialis. Light.'),
  X('thrust','Barbell or machine hip thrust',3,'8','Hands only steady the bar.',{step:10}),
  X('backext','45° back extension',3,'12','Arms crossed on the chest, not hanging. Squeeze the glutes at the top. Hold a plate on the chest to load it.'),
  X('lcurl','Lying leg curl',3,'10','Slow lower.')]},
 {code:'D',short:'Back+push',name:'Back + light push',time:'55 min',load:'Moderate',ex:[
  X('mrow','Machine row, neutral grip',[3,3,4,4],'10','Chest stays on the pad.'),
  X('cablerow','Seated cable row, neutral handle',[2,3,0,0],'10','Weeks 1–2. Pull to the lower ribs.'),
  X('inv','Inverted row at a Smith bar',[0,0,3,3],'8','Weeks 3–4. Feet on floor, bar to lower chest; raise the bar to make it easier.',{w:false}),
  X('sacr','Single-arm cable row',[2,2,3,3],'12 / side','Let the blade reach forward, then pull it back first.'),
  X('sapd','Straight-arm band pulldown',2,'12','Blade drops into the back pocket.'),
  X('proneext','Prone shoulder extension',2,'12','Face down, arms by your sides. Lift the arms back, blades down and back. Lower trap, not upper.',{step:1}),
  X('sler','Side-lying DB external rotation',2,'12–15','Towel under the elbow. Light.',{step:1}),
  X('pup','Push-up plus, hands on a bench',3,'10','At the top, push the floor away.',{w:false}),

  if(hi===lo){hi+=5;lo=Math.max(0,lo-5)}const padY=(hi-lo)*.12;lo=Math.max(0,lo-padY);hi+=padY;
  const t0=new Date(P[0].d+'T12:00').getTime(),t1=new Date(P[P.length-1].d+'T12:00').getTime()||t0+1;
  const x=d=>L+((new Date(d+'T12:00').getTime()-t0)/Math.max(1,t1-t0))*(W-L-R),y=w=>T+(1-(w-lo)/(hi-lo))*(H-T-B);
  const ticks=[lo,(lo+hi)/2,hi].map(v=>Math.round(v));
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight over time for '+esc(NAMES[k])+'">';
  ticks.forEach(v=>{s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/><text x="'+(L-6)+'" y="'+(y(v)+3).toFixed(1)+'" text-anchor="end">'+v+'</text>'});
  const line=P.map((p,i)=>(i?'L':'M')+x(p.d).toFixed(1)+' '+y(p.w).toFixed(1)).join(' ');
  s+='<path class="ar" d="'+line+' L'+x(P[P.length-1].d).toFixed(1)+' '+(H-B)+' L'+x(P[0].d).toFixed(1)+' '+(H-B)+' Z" opacity=".55"/><path class="ln" d="'+line+'"/>';
  P.forEach((p,i)=>{const last=i===P.length-1;s+='<circle class="'+(last?'end':'dt')+'" cx="'+x(p.d).toFixed(1)+'" cy="'+y(p.w).toFixed(1)+'" r="'+(last?4.5:3)+'"/>'});
  const lp=P[P.length-1];s+='<text class="endlbl" x="'+Math.min(x(lp.d),W-R).toFixed(1)+'" y="'+(y(lp.w)-9).toFixed(1)+'" text-anchor="end">'+lp.w+' lb</text>';
  const fmt=d=>new Date(d+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
  s+='<text x="'+L+'" y="'+(H-8)+'">'+fmt(P[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+fmt(lp.d)+'</text></svg>';
  return s;
}
let chartKey=lsGet('ssl-chart',null);
function renderLog(){
  const E=entries();const lb=lsGet('ssl-lastbackup',null);const age=lb?daysBetween(lb.slice(0,10),todayISO()):null;
  let h='<div class="sess"><span class="label">Every session you’ve logged</span><h1>Log</h1></div>';
  h+='<section class="block"><div class="bhead"><h2>Backup</h2></div><div class="prose backup"><p class="note">Your log lives on this phone. Export a copy to Files or email it to Elizabeth now and then. Do this before deleting or re-adding the home-screen icon.</p>'+
    '<div class="bbtns"><button class="bb primary" id="exportbtn">Export log</button><button class="bb" id="importbtn">Import</button></div>'+
    '<span class="bstat'+((age==null&&E.length)||(age!=null&&age>=7)?' stale':'')+'">'+(lb?'Last export: '+esc(pretty(lb.slice(0,10)))+(age>0?' ('+age+' day'+(age===1?'':'s')+' ago)':' (today)'):'Not exported yet')+'</span></div></section>';
  const keys=Object.keys(NAMES).filter(k=>E.some(l=>l.weights&&parseFloat(l.weights[k])>0));
  if(keys.length){if(!keys.includes(chartKey))chartKey=keys[0];
    h+='<section class="block"><div class="bhead"><h2>Weight trend</h2></div><div class="prose" style="display:grid;gap:10px"><select id="chartsel" aria-label="Exercise">'+
      keys.map(k=>'<option value="'+k+'"'+(k===chartKey?' selected':'')+'>'+esc(NAMES[k])+'</option>').join('')+'</select><div id="chartbox">'+chart(chartKey)+'</div></div></section>'}
  h+='<section class="block"><div class="bhead"><h2>Sessions</h2><span class="label">Tap for detail</span></div><div class="list">';
  if(!E.length)h+='<div class="empty"><h3>No sessions yet</h3>Tick a set or fill in the shoulder check and the session shows up here, with weights, flagged exercises and pain scores for Elizabeth.</div>';
  E.forEach(l=>{const s=sesBy(l.code),wk=l.week||1,{t,d}=totals(l,s);const felt=Object.entries(l.felt||{}).filter(([,f])=>f&&f.on);
    const pp=v=>v==null?'<span class="pp na">–</span>':'<span class="pp '+(v>3?'hi':'ok')+'">'+v+'</span>';
    h+='<details class="ent"><summary><span class="st">'+s.code+' · '+esc(s.name)+'</span><span class="sr"><span class="label">Pain</span>'+pp(l.pain)+'<span class="label">AM</span>'+pp(l.morning)+'</span><span class="sd">'+esc(pretty(l.date))+' · Wk '+wk+' · '+d+'/'+t+' sets'+(felt.length?' · <span class="fl">'+felt.length+' flagged</span>':'')+(l.tingle?' · <span class="fl">tingling</span>':'')+'</span></summary><div class="ebody">';
    h+='<div class="tbl"><table><thead><tr><th>Exercise</th><th>Weight</th><th>Sets</th></tr></thead><tbody>';
    exFor(s,wk).forEach(e=>{const n=setsFor(e,wk),dn=(l.sets[e.k]||[]).slice(0,n).filter(Boolean).length,f=(l.felt||{})[e.k];
      h+='<tr><td>'+esc(e.n)+(f&&f.on?'<br><span class="fl">Felt it'+((f.where||[]).length?': '+esc(f.where.join(', ')):'')+'</span>':'')+'</td><td class="n">'+(l.weights[e.k]?esc(l.weights[e.k])+' lb':(e.w?'–':'BW'))+'</td><td class="n">'+dn+'/'+n+'</td></tr>'});
    h+='</tbody></table></div><p class="note">Pain during: <b>'+(l.pain??'–')+'</b> · Next morning: <b>'+(l.morning??'–')+'</b> · Tingling: <b>'+(l.tingle===true?'yes':l.tingle===false?'no':'–')+'</b></p>'+
      (l.note?'<p class="note">“'+esc(l.note)+'”</p>':'')+'<div><button class="pill demo" data-open="'+esc(l.date)+'|'+l.code+'">Open this session</button></div></div></details>'});
  h+='</div></section>';
  $('#view-log').innerHTML=h;
}

function renderAll(){renderStrip();renderToday();renderPlan();renderLog()}

/* ================= backup ================= */
async function exportLog(){
  const data=JSON.stringify({app:'shoulder-safe-lifts',v:2,exported:new Date().toISOString(),week,logs},null,1);
  const name='lifts-log-'+todayISO()+'.json';
  const mark=()=>{lsSet('ssl-lastbackup',new Date().toISOString());renderLog()};
  try{const file=new File([data],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Lifts log'});mark();toast('Exported');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);mark();toast('Exported')}
  catch(e){toast('Export didn’t work on this device.')}
}
function importLog(file){
  const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||j.app!=='shoulder-safe-lifts'||!j.logs)throw 0;
    let n=0;Object.entries(j.logs).forEach(([k,v])=>{if(!v||!v.date||!v.code)return;if(!logs[k]||(v.updated||0)>(logs[k].updated||0)){logs[k]=v;n++}});
    lsSet('ssl-logs-v2',logs);renderAll();toast(n?'Imported '+n+' session'+(n===1?'':'s'):'Nothing new in that file')}
    catch(e){toast('That file isn’t a Lifts log export.')}};r.readAsText(file);
}

/* ================= events ================= */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.ses){selCode=d.ses;expanded.clear();renderStrip();renderToday();window.scrollTo({top:0});return}
  if(d.set){const l=ensure();const k=d.set,i=+d.i;const s=sesBy(selCode),e=s.ex.find(x=>x.k===k),n=setsFor(e,l.week||week);
    const a=(l.sets[k]||[]).slice();while(a.length<n)a.push(false);a[i]=!a[i];l.sets[k]=a;if(!l.updated)l.week=week;save(l);
    const doneNow=a.slice(0,n).filter(Boolean).length===n;if(!doneNow)expanded.delete(k);
    refreshRow(k);const nk=refreshNext();refreshProgress();renderStrip();renderLog();
    if(doneNow&&nk){const r=document.getElementById('row-'+nk);if(r)setTimeout(()=>r.scrollIntoView({behavior:'smooth',block:'start'}),250)}
    return}
  if(d.expand){const k=d.expand;if(expanded.has(k))expanded.delete(k);else expanded.add(k);refreshRow(k);return}
  if(d.step){const k=d.k,inp=document.getElementById('wt-'+k),e=sesBy(selCode).ex.find(x=>x.k===k);
    let v=parseFloat(inp.value);if(isNaN(v))v=parseFloat(inp.placeholder)||0;v=Math.max(0,Math.round((v+(+d.step)*e.step)*10)/10);
    inp.value=v;setWeight(k,String(v));return}
  if(d.use){const inp=document.getElementById('wt-'+d.use);inp.value=d.v;setWeight(d.use,d.v);b.remove();return}
  if(d.felt){const l=ensure();l.felt=l.felt||{};const f=l.felt[d.felt]||{on:false,where:[]};f.on=!f.on;l.felt[d.felt]=f;save(l);refreshRow(d.felt);renderLog();return}
  if(d.where){const l=ensure();const f=l.felt[d.where];const w=new Set(f.where||[]);w.has(d.x)?w.delete(d.x):w.add(d.x);f.where=WHERE.filter(x=>w.has(x));save(l);refreshRow(d.where);renderLog();return}
  if(d.demo){const k=d.demo,e=sesBy(selCode).ex.find(x=>x.k===k);if(openDemos.has(k))openDemos.delete(k);else openDemos.add(k);
    const o=openDemos.has(k);b.setAttribute('aria-expanded',o);b.innerHTML=(o?'Hide demo':'Demo')+' '+ICON_PLAY;document.getElementById('vs-'+k).innerHTML=demoBox(e);return}
  if(d.pain!=null){const l=ensure();const v=+d.pain;l.pain=l.pain===v?null:v;save(l);renderCheck();renderStrip();renderLog();return}
  if(d.morning!=null){const l=ensure();const v=+d.morning;l.morning=l.morning===v?null:v;save(l);renderCheck();renderLog();return}
  if(d.tg){const l=ensure();const v=d.tg==='yes';l.tingle=l.tingle===v?null:v;save(l);renderCheck();renderLog();return}
  if(d.week){week=+d.week;lsSet('ssl-week',week);renderPlan();renderToday();return}
  if(d.open){const [dt,c]=d.open.split('|');selDate=dt;selCode=c;expanded.clear();renderStrip();renderToday();showTab('today');return}
  if(b.id==='exportbtn'){exportLog();return}
  if(b.id==='importbtn'){$('#importfile').click();return}
});
function setWeight(k,v){const l=ensure();v=(v||'').trim();if(v)l.weights[k]=v;else delete l.weights[k];if(!l.updated)l.week=week;save(l)}
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.dataset.wt!=null){setWeight(t.dataset.wt,t.value);return}
  if(t.dataset.note){const l=ensure();l.note=t.value;save(l);return}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset.wt!=null||t.dataset.note){renderLog();return}
  if(t.id==='datepick'&&t.value){selDate=t.value>todayISO()?todayISO():t.value;selCode=pickSession(selDate);expanded.clear();renderStrip();renderToday();return}
  if(t.id==='chartsel'){chartKey=t.value;lsSet('ssl-chart',chartKey);$('#chartbox').innerHTML=chart(chartKey);return}
  if(t.id==='importfile'&&t.files&&t.files[0]){importLog(t.files[0]);t.value=''}});

/* tabs */
const TABS=['today','plan','log'];let curTab='today';
function showTab(v){curTab=v;TABS.forEach(x=>{$('#view-'+x).hidden=x!==v;const t=$('#tab-'+x);t.setAttribute('aria-selected',x===v);t.tabIndex=x===v?0:-1});
  $('#strip').hidden=v!=='today';window.scrollTo({top:0});wake()}
TABS.forEach((v,i)=>{const t=$('#tab-'+v);t.onclick=()=>showTab(v);
  t.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const n=TABS[(i+(e.key==='ArrowRight'?1:2))%3];showTab(n);$('#tab-'+n).focus()}}});

/* clock: the app can sit suspended overnight on iPhone */
function checkClock(){const t=todayISO();if(t!==lastSeenToday){const wasToday=selDate===lastSeenToday;lastSeenToday=t;
  if(wasToday){selDate=t;selCode=pickSession(t);expanded.clear();openDemos.clear()}renderAll()}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkClock();wake()}});
window.addEventListener('pageshow',checkClock);window.addEventListener('focus',checkClock);

/* keep the screen awake on the session tab */
let lock=null;
async function wake(){try{if(curTab==='today'&&document.visibilityState==='visible'&&'wakeLock' in navigator){if(!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null})}}
  else if(lock&&curTab!=='today'){await lock.release();lock=null}}catch(e){lock=null}}

/* storage + offline */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}

renderAll();wake();
})();
</script>
